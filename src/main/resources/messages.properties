# =============================================================================
# Texte der Anwendung ("Message Bundle")
#
# Spring Boot lädt diese Datei automatisch. Jede Zeile hat die Form
#     schlüssel=Text
# Im Code bzw. im Template wird nur der Schlüssel verwendet, der Text steht hier.
# Vorteil: Alle Texte an einem Ort; für eine weitere Sprache könnte man einfach
# eine Datei messages_en.properties mit denselben Schlüsseln anlegen.
#
# Zeilen, die mit # beginnen, sind Kommentare.
# =============================================================================

# -----------------------------------------------------------------------------
# Deutsche Fehlertexte für error.html
# Schlüssel: error.<HTTP-Statuscode>  (siehe #messages.msgOrNull in error.html)
# -----------------------------------------------------------------------------
error.400=Ungültige Anfrage
error.401=Nicht angemeldet
error.403=Zugriff verweigert
error.404=Seite nicht gefunden
error.405=Methode nicht erlaubt
error.415=Nicht unterstützter Medientyp
error.500=Interner Serverfehler
error.503=Dienst nicht verfügbar

# -----------------------------------------------------------------------------
# Hinweise zu den Formularfeldern in index.html
# Schlüssel: <Fehlercode>.<Objektname>.<Feldname>
#
#   required / negative : eigene Codes aus PersonController (bindingResult.rejectValue)
#   typeMismatch        : Code von Spring, wenn ein Wert nicht umgewandelt werden
#                         kann, z.B. "1.5" oder "abc" statt einer ganzen Zahl
# -----------------------------------------------------------------------------
required.person.firstName=Bitte einen Vornamen eingeben.
typeMismatch.person.age=Bitte eine ganze Zahl eingeben.
negative.person.age=Das Alter darf nicht negativ sein.

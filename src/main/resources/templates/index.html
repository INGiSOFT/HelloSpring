<!DOCTYPE html>
<!--/*
    Die View (das "V" in MVC): Hauptseite zum Erfassen und Anzeigen von Personen.

    Dies ist ein Thymeleaf-Template. Es ist normales HTML mit zusätzlichen
    Attributen, die mit "th:" beginnen. Diese werden auf dem Server ausgewertet
    und durch echte Werte ersetzt, bevor die Seite an den Browser geht.
    Der Browser sieht also nie ein "th:"-Attribut.

    Wichtige Ausdrücke:
      ${...}  Variable aus dem Model, z.B. ${persons} (siehe PersonController)
      *{...}  Eigenschaft des Formular-Objekts (th:object), z.B. *{firstName}
      @{...}  Link/URL innerhalb der Anwendung, z.B. @{/index}
      #lists, #fields  Hilfsobjekte von Thymeleaf

    Kommentare in dieser Schreibweise sind Thymeleaf-Kommentare: Sie werden
    auf dem Server entfernt und erscheinen nicht im HTML-Quelltext im Browser.

    Für das Aussehen verwenden wir Tailwind CSS: Statt eigener CSS-Dateien
    stehen kleine Hilfsklassen direkt im class-Attribut, z.B.
      p-4         = Innenabstand (padding)
      rounded-2xl = abgerundete Ecken
      text-sm     = kleine Schrift
      md:...      = gilt erst ab mittlerer Bildschirmbreite (ab 768px)
*/-->
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!--/* Sorgt dafür, dass die Seite auf dem Smartphone nicht winzig dargestellt wird */-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personen</title>
    <!--/* Tailwind CSS wird als WebJar (siehe pom.xml) vom eigenen Server geladen */-->
    <script th:src="@{/webjars/tailwindcss__browser/dist/index.global.js}"></script>
</head>
    <body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-sky-100 p-4 sm:p-8 text-slate-800">
        <div class="mx-auto w-full max-w-5xl space-y-6">

            <h1 class="text-3xl font-bold tracking-tight text-slate-900">Personen</h1>

            <!--/*
                Zweispaltiges Raster (CSS Grid):
                - Auf kleinen Bildschirmen: eine Spalte, die Bereiche stehen untereinander.
                - Ab "md" (768px): zwei Spalten im Verhältnis 2 : 3
                  (links Erfassung, rechts Liste).
            */-->
            <div class="grid gap-6 md:grid-cols-[minmax(0,2fr)_minmax(0,3fr)] items-start">

                <!--/* ===== Erfassungsbereich ===== */-->
                <!--/* md:sticky = bleibt beim Scrollen langer Listen oben sichtbar */-->
                <section class="bg-white/80 backdrop-blur rounded-2xl shadow-xl ring-1 ring-slate-200 p-6 sm:p-8 space-y-5 md:sticky md:top-8">
                    <h2 class="text-lg font-semibold text-slate-900">Neue Person erfassen</h2>

                    <!--/*
                        Das Formular:
                        - th:action  : wohin die Daten geschickt werden (-> @PostMapping im Controller)
                        - th:object  : das Objekt "person" aus dem Model, das die Felder füllt
                        - method=post: Daten werden per HTTP-POST gesendet
                        - novalidate : schaltet die Prüfung des Browsers aus, damit wir die
                                       Prüfung des Servers (und dessen Fehlermeldungen) sehen
                    */-->
                    <form th:action="@{/index}" th:object="${person}" method="post" novalidate class="space-y-4">
                        <label class="block">
                            <span class="text-sm font-medium text-slate-600">Vorname</span>
                            <!--/*
                                th:field="*{firstName}" erzeugt automatisch
                                id="firstName", name="firstName" und value="..." (aktueller Wert).
                                th:errorclass fügt CSS-Klassen hinzu, wenn das Feld einen Fehler hat
                                (rote Umrandung).
                            */-->
                            <input type="text" th:field="*{firstName}" required
                                   class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none"
                                   th:errorclass="'border-rose-500 ring-2 ring-rose-200'">
                            <!--/* Fehlermeldung, nur sichtbar wenn es für dieses Feld einen Fehler gibt.
                                   Der Text kommt aus messages.properties. */-->
                            <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"
                               class="mt-1 text-sm text-rose-600"></p>
                        </label>
                        <label class="block">
                            <span class="text-sm font-medium text-slate-600">Alter</span>
                            <input type="number" th:field="*{age}" min="0"
                                   class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none"
                                   th:errorclass="'border-rose-500 ring-2 ring-rose-200'">
                            <p th:if="${#fields.hasErrors('age')}" th:errors="*{age}"
                               class="mt-1 text-sm text-rose-600"></p>
                        </label>
                        <button type="submit"
                                class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white shadow hover:bg-indigo-700 active:bg-indigo-800 transition-colors">
                            Person hinzufügen
                        </button>
                    </form>
                </section>

                <!--/* ===== Anzeigebereich ===== */-->
                <section class="bg-white/80 backdrop-blur rounded-2xl shadow-xl ring-1 ring-slate-200 p-6 sm:p-8 space-y-4">
                    <h2 class="text-lg font-semibold text-slate-900">
                        <!--/* th:text ersetzt den Inhalt des Elements, hier z.B. durch "(3)" */-->
                        Erfasste Personen <span class="text-sm font-normal text-slate-500" th:text="'(' + ${#lists.size(persons)} + ')'"></span>
                    </h2>

                    <!--/* th:if / th:unless: Element nur anzeigen, wenn die Bedingung zutrifft bzw. nicht zutrifft */-->
                    <p th:if="${#lists.isEmpty(persons)}" class="text-sm text-slate-500">Noch keine Personen erfasst.</p>
                    <ul th:unless="${#lists.isEmpty(persons)}"
                        class="divide-y divide-slate-200 rounded-lg ring-1 ring-slate-200 bg-white">
                        <!--/*
                            th:each ist eine Schleife wie "for (Person p : persons)" in Java:
                            Das <li> wird für jede Person einmal wiederholt.
                        */-->
                        <li th:each="p : ${persons}" class="flex items-center justify-between px-4 py-2">
                            <span class="font-medium" th:text="${p.firstName}"></span>
                            <!--/* Bedingung ? dann : sonst  ->  "42 Jahre" oder "–" falls kein Alter angegeben */-->
                            <span class="text-sm text-slate-500"
                                  th:text="${p.age != null} ? ${p.age} + ' Jahre' : '–'"></span>
                        </li>
                    </ul>
                </section>
            </div>
        </div>
    </body>
</html>
